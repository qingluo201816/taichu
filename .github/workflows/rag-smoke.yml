name: RAG 五条冒烟回归

on:
  pull_request:

concurrency:
  group: rag-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rag-smoke:
    name: 真实生产链五条 Golden
    runs-on: [self-hosted, windows, taichu-rag]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 安装 uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: 同步锁定依赖
        run: uv sync --frozen --group dev
      - name: 校验评测契约
        run: uv run pytest tests/unit/application/evaluations/rag tests/unit/infrastructure/evaluations/rag -q
      - name: 运行五条生产链冒烟门禁
        run: uv run python scripts/evaluate_rag.py smoke
      - name: 上传评测报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-smoke-report-${{ github.run_id }}
          path: project_assets/derived/rag_evaluations/*.json
          if-no-files-found: warn

