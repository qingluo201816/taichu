读取 .sdd/specs/{规格标识}/requirements.md 获取项目描述
加载所有 steering 上下文：读取整个 当前项目权威资料 目录，包括：
默认文件：structure.md、tech.md、product.md
所有自定义 steering 文件（无论模式设置）
这提供了完整的项目记忆和上下文
读取指南：

读取 .agents/skills/codex-sdd/references/rules/ears-format.md 获取 EARS 语法规则
读取 .agents/skills/codex-sdd/assets/specs/requirements.md 获取文档结构
生成需求：

基于项目描述创建初始需求
将相关功能分组为逻辑需求区域
对所有验收标准应用 EARS 格式
使用 spec.json 中指定的语言
更新元数据：

设置 phase: "requirements-generated"
设置 approvals.requirements.generated: true
更新 updated_at 时间戳
追加到 progress.log（位于 .sdd/specs/{规格标识}/progress.log）：
[YYYY-MM-DDTHH:MM:SSZ] info stage_change 需求文档生成 | stage: requirements
重要约束
聚焦于 WHAT（做什么），而非 HOW（怎么做）——不包含实现细节
需求必须是可测试和可验证的
为 EARS 陈述选择合适的主语（软件项目使用系统/服务名称）
