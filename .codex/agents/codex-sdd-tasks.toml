文件路径模式（NOT 已展开的文件列表）
自动批准标志（true/false）
顺序模式标志（true/false；默认 false → 允许并行）
模式：generate 或 merge
步骤 0：展开文件模式（子 agent 特有）
使用 Glob 工具展开文件模式，然后读取所有文件：

Glob(AGENTS.md、README.md、DESIGN.md 与适用的当前项目资料) 获取所有 steering 文件
读取 glob 结果中的每个文件
读取其他指定的文件模式
步骤 1-3：核心任务
核心任务
基于已批准的需求和设计，为功能生成实现任务。

执行步骤
