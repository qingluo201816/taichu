读取所有必要的上下文：

.sdd/specs/{规格标识}/spec.json、requirements.md、design.md

.sdd/specs/{规格标识}/tasks.md（如存在，用于合并模式）

整个 当前项目权威资料 目录以获取完整项目记忆

确定执行模式：

sequential = (sequential 标志为 true)
验证批准状态：

如果自动批准标志为 true：在 spec.json 中自动批准需求和设计
否则：验证两者均已批准（如未批准则停止，参见安全与降级）
步骤 2：生成实现任务
读取 .agents/skills/codex-sdd/references/rules/tasks-generation.md 获取原则
读取 .agents/skills/codex-sdd/references/rules/tasks-parallel-analysis.md 获取并行判断标准
读取 .agents/skills/codex-sdd/assets/specs/tasks.md 获取格式（支持 (P) 标记）
遵循所有规则生成任务列表：

使用 spec.json 中指定的语言
映射所有需求到任务，仅列出数字需求 ID（逗号分隔），不带描述后缀、括号、翻译或自由格式标签
确保所有设计组件都包含在内
验证任务进度逻辑且递增
当 !sequential 时，对满足并行标准的任务应用 (P) 标记
当任务看似并行但不安全时，明确说明阻止 (P) 的依赖
如果顺序模式为 true，完全省略 (P)
如果找到现有 tasks.md，与新内容合并
步骤 3：完成
写入和更新：

创建/更新 .sdd/specs/{规格标识}/tasks.md
更新 spec.json 元数据：
设置 phase: "tasks-generated"
设置 approvals.tasks.generated: true, approved: false
设置 approvals.requirements.approved: true
设置 approvals.design.approved: true
更新 updated_at 时间戳
追加到 progress.log（位于 .sdd/specs/{规格标识}/progress.log）： [YYYY-MM-DDTHH:MM:SSZ] info stage_change 任务清单生成 | stage: tasks
关键约束
严格遵循规则：tasks-generation.md 中的所有原则都是强制性的
自然语言：描述做什么，而非代码结构细节
完整覆盖：所有需求必须映射到任务
